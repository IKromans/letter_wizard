<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burtiņu Burvis</title>
<style>
:root {
 --bg: #10172a;
 --g1: #293a65;
 --g2: #422d62;
 --panel: #19243d;
 --panel2: #202e4b;
 --c1: #1c2945;
 --c2: #17223a;
 --field: #101a30;
 --ink: #f4f6ff;
 --muted: #aab6d3;
 --gold: #ffd166;
 --mint: #75e6c1;
 --blue: #8ab4ff;
 --bad: #ff6b7d;
 --pend: #71809f;
 --foot: #8290ad;
 --m1: #27385c;
}

* { box-sizing: border-box; }
html { color-scheme: dark; }

body {
 margin: 0;
 min-height: 100vh;
 background:
  radial-gradient(ellipse at 20% 0%, var(--g1) 0, transparent 40%),
  radial-gradient(ellipse at 90% 20%, var(--g2) 0, transparent 35%),
  var(--bg);
 color: var(--ink);
 font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
 display: flex;
 justify-content: center;
 padding: 26px 16px 40px;
}

.app { width: min(100%, 1000px); }

header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 12px;
 margin-bottom: 20px;
 flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 38px; filter: drop-shadow(0 4px 12px #0005); }
h1 { font-size: clamp(22px, 4vw, 32px); margin: 0; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; }

.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.tool{display:inline-flex;align-items:center;min-height:42px;padding:9px 14px;border:1px solid #ffffff24;border-radius:999px;background:#ffffff0c;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:.9rem;font-weight:750;line-height:1.2;text-decoration:none;cursor:pointer;backdrop-filter:blur(12px)}
.tool:hover{border-color:#ffffff70;background:#ffffff18}
@media(max-width:640px){.tools{gap:7px}.tool{padding-inline:11px}}
@media(max-width:420px){.tools{gap:6px}.tool{min-height:38px;padding-inline:9px;font-size:.82rem}}
.pill {
 border: 1px solid #ffffff20;
 background: #ffffff0b;
 padding: 9px 13px;
 border-radius: 99px;
 color: var(--muted);
 font-size: 13px;
}
.panel {
 background: linear-gradient(145deg, var(--c1), var(--c2));
 border: 1px solid #ffffff18;
 border-radius: 22px;
 padding: 22px;
 box-shadow: 0 18px 50px #0003;
}
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }

select,
button,
input[type="text"] {
 font: inherit;
 border: 0;
 border-radius: 12px;
 padding: 11px 14px;
}
select,
input[type="text"] {
 background-color: var(--panel2);
 color: var(--ink);
 border: 1px solid #ffffff20;
}
select {
 appearance: none;
 -webkit-appearance: none;
 cursor: pointer;
 padding-right: 34px;
 background-image:
  linear-gradient(45deg, transparent 50%, var(--muted) 50%),
  linear-gradient(135deg, var(--muted) 50%, transparent 50%);
 background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
 background-size: 5px 5px;
 background-repeat: no-repeat;
}
select option { background: var(--panel); color: var(--ink); }
select option:checked { background: var(--c1); color: var(--gold); }
button { cursor: pointer; font-weight: 800; transition: transform .15s, filter .15s; }
button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
button:active { transform: translateY(0); }
button:disabled { opacity: .4; cursor: default; }
.primary { background: linear-gradient(135deg, #ffd166, #ffad5c); color: #38270c; box-shadow: 0 5px 0 #b87837; }
.secondary { background: #ffffff12; color: var(--ink); border: 1px solid #ffffff20; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { background: #ffffff09; border: 1px solid #ffffff12; border-radius: 15px; padding: 12px 14px; }
.stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.stat strong { display: block; font-size: 25px; margin-top: 3px; color: var(--gold); font-variant-numeric: tabular-nums; }
.progress { height: 8px; background: #ffffff12; border-radius: 99px; overflow: hidden; margin: 0 0 18px; }
.progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--blue)); transition: width .2s; }
.prompt-wrap { position: relative; background: var(--field); border: 1px solid #ffffff17; border-radius: 18px; padding: 24px; min-height: 174px; }
.prompt-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 14px; }
.prompt { font-size: clamp(21px, 3.3vw, 31px); line-height: 1.75; letter-spacing: .3px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: none; }
.prompt .correct { color: var(--mint); }
.prompt .wrong { color: var(--bad); background: #ff6b7d20; border-radius: 4px; }
.prompt .current { border-bottom: 3px solid var(--gold); animation: blink 1s infinite; }
.prompt .pending { color: var(--pend); }
@keyframes blink{50%{border-color:transparent}}
.input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:text;resize:none;border:0}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:13px 0 0}
.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.message{color:var(--muted);font-size:14px;min-height:22px}
details{margin-top:18px;background:#ffffff08;border:1px solid #ffffff14;border-radius:16px;padding:14px 16px}
summary{cursor:pointer;font-weight:800;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row input[type=text]{flex:1;min-width:200px}
.row label{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
#customText{width:100%;height:140px;margin-top:12px;background:var(--field);color:var(--ink);border:1px solid #ffffff20;border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
.small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.footer{text-align:center;color:var(--foot);font-size:12px;margin-top:18px}
.overlay{position:fixed;inset:0;background:#080d1dcc;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.overlay.show{display:flex}
.modal{width:min(440px,100%);text-align:center;background:linear-gradient(145deg,var(--m1),var(--panel));border:1px solid #ffffff2b;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008;position:relative;overflow:hidden}
.modal .trophy{font-size:58px}.modal h2{font-size:30px;margin:8px 0}.modal p{color:var(--muted);line-height:1.5}
.result{display:flex;justify-content:center;gap:26px;margin:18px 0}.result strong{display:block;font-size:27px;color:var(--gold)}.result span{font-size:12px;color:var(--muted)}
.spark{position:fixed;pointer-events:none;z-index:9;font-size:20px;animation:fly 1.2s ease-out forwards}
.cursor-spark{position:fixed;pointer-events:none;z-index:9;font-size:var(--size);color:var(--gold);text-shadow:0 0 12px currentColor;animation:cursor-fly .8s ease-out forwards}
@keyframes cursor-fly{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-36px) scale(1.3) rotate(90deg);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) scale(.5) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(160deg);opacity:0}}
@media (max-width: 600px) {
 body { padding: 16px 10px 28px; }
 .panel { padding: 15px; }
 .stats { grid-template-columns: repeat(2, 1fr); }
 .prompt-wrap { padding: 17px; min-height: 190px; }
 .controls { gap: 7px; }
 .controls select { flex: 1; min-width: 125px; }
 .brand .logo { font-size: 31px; }
}
.prompt .pop{display:inline-block;animation:popk .28s ease-out}
@keyframes popk{0%{transform:scale(1.7);color:var(--gold)}100%{transform:scale(1)}}
.prompt .shake{display:inline-block;animation:shk .22s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dot{position:fixed;pointer-events:none;z-index:6;font-size:15px;animation:rise .75s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-38px) scale(1.3);opacity:0}}
.prompt-wrap{transition:box-shadow .3s,border-color .3s}
.prompt-wrap.hot{border-color:var(--gold);box-shadow:0 0 26px -6px var(--gold)}
.prompt-wrap.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--mint)}100%{box-shadow:0 0 0 16px transparent}}
.combo{position:absolute;top:14px;right:16px;font-weight:800;font-size:18px;color:var(--gold);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;pointer-events:none}
.combo.show{opacity:1;transform:scale(1)}.combo.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.6) rotate(-6deg)}}
.progress>div{position:relative;overflow:hidden}
.progress>div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff55,transparent);animation:shim 1.8s linear infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.overlay.show{animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.overlay.show .modal{animation:modalin .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes modalin{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.modal::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(#ffffff0c 0 12deg,transparent 12deg 24deg);animation:spin 40s linear infinite;pointer-events:none}
.modal>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay.show .trophy{display:inline-block;animation:trophy 1.8s ease-in-out infinite}
@keyframes trophy{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg) scale(1.1)}}
.result strong{animation:none}
.confetti{position:fixed;top:-20px;z-index:8;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),108vh) rotate(var(--rot));opacity:.9}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti,.spark,.dot,.cursor-spark{display:none}}
</style>
</head>
<body>
<main class="app">
 <header>
  <div class="brand">
   <div class="logo">🪄</div>
   <div>
    <h1 data-i="title"></h1>
    <div class="sub" data-i="sub"></div>
   </div>
  </div>
  <div class="tools">
   <a class="tool" href="./index.html" data-i="home"></a>
   <button class="tool" id="themeBtn" type="button" data-i="theme"></button>
   <button class="tool" id="soundBtn" type="button" aria-pressed="false">🔊 Skaņa</button>
   <button class="tool" id="lang" type="button" data-i="lang_btn" aria-label="Switch language">🌐 LV</button>
  </div>
 </header>

 <section class="panel">
  <div class="controls">
   <select id="mode" aria-label="Spēles režīms">
    <option value="words" data-i="m_words"></option>
    <option value="story" data-i="m_story"></option>
    <option value="custom" data-i="m_custom"></option>
   </select>
   <select id="duration" aria-label="Spēles ilgums">
    <option value="30" data-i="d30"></option>
    <option value="60" data-i="d60"></option>
    <option value="0" data-i="d0"></option>
   </select>
   <select id="level" aria-label="Grūtības pakāpe">
    <option value="easy" data-i="l_easy"></option>
    <option value="normal" selected data-i="l_normal"></option>
    <option value="hard" data-i="l_hard"></option>
   </select>
   <button class="primary" id="startBtn" data-i="start"></button>
   <button class="secondary" id="resetBtn" title="Sākt no jauna">↻</button>
   <button class="secondary" id="finishBtn" disabled data-i="finish"></button>
  </div>

  <div class="stats">
   <div class="stat"><small data-i="s_time"></small><strong id="time">30</strong></div>
   <div class="stat"><small data-i="s_speed"></small><strong id="wpm">0</strong></div>
   <div class="stat"><small data-i="s_acc"></small><strong id="accuracy">100%</strong></div>
   <div class="stat"><small data-i="s_stars"></small><strong id="stars">0 ⭐</strong></div>
  </div>
  <div class="progress"><div id="progress"></div></div>

  <div class="prompt-wrap" id="promptWrap">
   <div class="prompt-label" id="promptLabel">Ieraksti redzamos vārdus</div>
   <div class="prompt" id="prompt"></div>
   <div class="combo" id="combo"></div>
   <textarea
    class="input"
    id="typing"
    aria-label="Rakstīšanas laukums"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
   ></textarea>
  </div>
  <div class="hint" data-i="hint"></div>
  <div class="bottom">
   <div class="message" id="message">Katrs burts ir solis pretī burvju pilij! 🏰</div>
   <div class="pill" id="status">Gatavs</div>
  </div>

  <details id="lib">
   <summary data-i="sum"></summary>
   <textarea id="customText" data-p="ph"></textarea>
   <div class="row">
    <label><input type="checkbox" id="keep"> <span data-i="keep"></span></label>
    <button class="primary" id="useBtn" data-i="use"></button>
    <span class="message" id="libMsg"></span>
   </div>
   <div class="small" data-i="small"></div>
  </details>
 </section>

 <div class="footer">
  <div data-i="foot_tip"></div>
  <div data-i="foot_credit" style="margin-top: 6px"></div>
 </div>
</main>
<div class="overlay" id="overlay">
 <div class="modal">
  <div class="trophy" id="trophy">🏆</div>
  <h2 id="resultTitle">Lieliski!</h2>
  <p id="resultText">Tu paveici lielisku darbu!</p>
  <div class="result">
   <div><strong id="finalWpm">0</strong><span data-i="u_wpm"></span></div>
   <div><strong id="finalAcc">100%</strong><span data-i="u_acc"></span></div>
   <div><strong id="finalStars">0 ⭐</strong><span data-i="u_stars"></span></div>
  </div>
  <button class="primary" id="againBtn" data-i="again"></button>
 </div>
</div>

function updateStats() {

  ? started
   ? Math.max(0, Math.ceil((endAt - Date.now()) / 1000))
   : finished ? 0 : dur

function handle() {

 if (started && dur && Date.now() >= endAt) {
  finish("time");
  return;

  value = value.slice(0, target.length);
  textarea.value = value;

 if (value.length && !started) begin();

 for (let i = prev; i < value.length; i++) {
  keys++;
  if (value[i] === target[i]) {
   keysOk++;
   streak++;
   best = Math.max(best, streak);
  } else {
   hasWrongCharacter = true;
   streak = 0;
  }

  if (hasWrongCharacter) sound(170, .07, "triangle", .018);
