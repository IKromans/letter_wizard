<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10172a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Ciparu Burvis</title>
<style>
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/baloo2.woff2) format("woff2")}
:root{--bg:#10172a;--g1:#293a65;--g2:#422d62;--panel:#19243d;--panel2:#202e4b;--ink:#f4f6ff;--muted:#aab6d3;--mint:#75e6c1;--gold:#ffd166;--shadow:rgba(0,0,0,.4);
--bg1:var(--g1);--bg2:var(--g2);--card:var(--panel);--text:var(--ink);--ok:var(--mint);--chip:var(--panel2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:radial-gradient(ellipse at 18% 0%,var(--bg1),transparent 48%),radial-gradient(ellipse at 92% 20%,var(--bg2),transparent 42%),var(--bg) fixed;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overflow-y:auto;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none}
.wrap{max-width:1032px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column}
/* header: same layout and sizes as the typing game */
.site-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(64px,12vh,110px);flex-wrap:wrap;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:38px;filter:drop-shadow(0 4px 12px #0005)}
.brand h1{font-size:clamp(22px,4vw,32px);font-weight:700;margin:0;letter-spacing:.2px;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
@media(max-width:600px){.wrap{padding:16px 10px 28px}.brand .logo{font-size:31px}}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;align-self:flex-start}
/* narrower screens (when title and buttons no longer fit side by side): the buttons stay on the top row like on the home page, the title goes below */
@media(max-width:960px){.site-head .tools{order:-1;width:100%}}
.tool{display:inline-flex;align-items:center;min-height:42px;padding:9px 14px;border:1px solid #ffffff24;border-radius:999px;background:#ffffff0c;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:.9rem;font-weight:750;line-height:1.2;text-decoration:none;cursor:pointer;backdrop-filter:blur(12px)}
.tool:hover{border-color:#ffffff70;background:#ffffff18}
@media(max-width:640px){.tools{gap:7px}.tool{padding-inline:11px}}
@media(max-width:420px){.tools{gap:6px}.tool{min-height:38px;padding-inline:9px;font-size:.82rem}}
.screen{display:none;flex-direction:column;gap:14px;width:100%;max-width:760px;margin:0 auto}
.screen.on{display:flex;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{flex:1 1 40%;font:inherit;font-size:1.4rem;font-weight:800;border:0;border-radius:18px;padding:10px;background:var(--chip);color:var(--text);cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .08s}
.chip.on{background:var(--gold);color:#322849;transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.chip:active{transform:translateY(4px);box-shadow:none}
.lv .chip,.len .chip{flex:1 1 28%}
.hint{margin-top:10px;color:var(--muted);font-size:1.05rem;min-height:1.4em}
.go{font:inherit;font-size:2rem;font-weight:800;border:0;border-radius:24px;padding:14px;background:var(--ok);color:#152a30;cursor:pointer;box-shadow:0 8px 0 #387e72;text-shadow:0 1px 0 rgba(255,255,255,.2)}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #387e72}
.top{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:1.2rem}
.top button{font:inherit;font-size:1.3rem;border:0;border-radius:14px;padding:6px 12px;background:rgba(255,255,255,.25);color:#fff;cursor:pointer}
.bar{flex:1;height:16px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffd23f;border-radius:10px;transition:width .25s}
.q{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.fox{font-size:3rem;display:inline-block}
.fox.jump{animation:jump .4s}
@keyframes jump{40%{transform:translateY(-22px) rotate(-10deg) scale(1.2)}}
.say{color:var(--muted);font-size:1.1rem;min-height:1.4em}
.qt{font-size:clamp(2.6rem,13vw,5rem);font-weight:800;line-height:1.1;animation:pop .2s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{font:inherit;font-size:clamp(2rem,10vw,3.4rem);font-weight:800;min-height:110px;border:0;border-radius:24px;color:#fff;cursor:pointer;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 8px 0 rgba(0,0,0,.28);transition:transform .08s}
.ans:nth-child(1){background:#ff6b6b}.ans:nth-child(2){background:#f59e0b}.ans:nth-child(3){background:#14b8a6}.ans:nth-child(4){background:#4c8dff}
.ans:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.ans.ok{background:var(--ok);animation:pop .35s}
.ans.no{opacity:.3;animation:shake .3s;pointer-events:none}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.end{text-align:center;align-items:center;justify-content:center;min-height:55vh}
.stars{font-size:clamp(3rem,16vw,5rem);letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
.big{font-size:2.4rem;font-weight:800}
.footer{text-align:center;color:var(--foot);font-size:12px;margin-top:18px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.cursor-spark{position:fixed;z-index:10;pointer-events:none;color:var(--gold);font-size:var(--size);font-weight:800;text-shadow:0 0 12px currentColor;animation:cursorSpark .8s ease-out forwards}
@keyframes cursorSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-35px) scale(1.3) rotate(90deg)}}
@media(prefers-reduced-motion:reduce){.cursor-spark{display:none}}
</style>
<script src="./sky.js" defer></script>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
<header class="site-head">
 <div class="brand">
  <div class="logo" aria-hidden="true">🦊</div>
  <div>
   <h1 id="gameTitle">Ciparu Burvis</h1>
   <div class="sub" id="gameSub">Rēķini, mācies un krāj zvaigznes!</div>
  </div>
 </div>
<nav class="tools" aria-label="Game navigation">
  <a class="tool" href="./index.html" id="homeLink">✨ Sākums</a>
  <button class="tool" id="themeBtn" type="button" data-burst="digits">🪄 Krāsas</button>
  <button class="tool" id="skyBtn" type="button" data-sky-btn>🌙 Nakts</button>
  <button class="tool" id="musicBtn" type="button" data-music-btn aria-pressed="true">🎵 Mūzika</button>
  <button class="tool" id="snd" type="button">🔊 Skaņa</button>
  <button class="tool" id="langBtn" type="button" aria-label="Switch language">🌐 LV</button>
</nav>
</header>

<div class="screen on" id="menu">
  <div class="card"><h2 id="opsTitle">Ko trenēsim?</h2><div class="chips" id="ops"></div></div>
  <div class="card"><h2 id="levelTitle">Grūtības pakāpe</h2><div class="chips lv" id="lv"></div><div class="hint" id="hint"></div></div>
  <div class="card"><h2 id="lengthTitle">Cik uzdevumu?</h2><div class="chips len" id="len"></div></div>
  <button class="go" id="start">Sākt! 🚀</button>
</div>

<div class="screen" id="game">
  <div class="top"><button id="back" aria-label="Home">⌂</button><div class="bar"><i id="pb"></i></div><span id="cnt">0/10</span><span id="st">🔥0</span></div>
  <div class="card q"><span class="fox" id="fox">🦊</span><div class="say" id="say"></div><div class="qt" id="qt"></div></div>
  <div class="grid" id="grid"></div>
</div>

<div class="screen end" id="end">
  <div class="stars" id="stars"></div>
  <div class="big" id="res"></div>
  <div class="say" id="msg" style="color:#fff"></div>
  <button class="go" id="again" style="width:100%">Spēlēt vēlreiz 🔁</button>
  <button class="chip" id="menuBtn" style="flex:none;width:100%">Izvēlne</button>
</div>

<div class="footer">
 <div id="footTip">Padoms: nesteidzies — vispirms padomā, tad spied. ✨</div>
 <div style="margin-top:6px">2026</div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[r(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const OPS={add:"+",sub:"−",mul:"×",div:"÷"};
const COPY={
  lv:{title:"Ciparu Burvis",footTip:"Padoms: nesteidzies — vispirms padomā, tad spied. ✨",sub:"Rēķini, mācies un krāj zvaigznes!",home:"Sākums",opsTitle:"Ko trenēsim?",levelTitle:"Grūtības pakāpe",lengthTitle:"Cik uzdevumu?",start:"Sākt! 🚀",again:"Spēlēt vēlreiz 🔁",menu:"Izvēlne",soundOn:"🔊 Skaņa",soundOff:"🔇 Bez skaņas",theme:"🪄 Krāsas",language:"🌐 LV",homeLabel:"Sākums",
    ops:{add:"Saskaitīšana",sub:"Atņemšana",mul:"Reizināšana",div:"Dalīšana"},levels:["⭐ Viegls","⭐⭐ Vidējs","⭐⭐⭐ Grūts"],
    hints:{add:["līdz 20","divciparu + vienciparu","divciparu + divciparu"],sub:["līdz 20","divciparu − vienciparu","divciparu − divciparu"],mul:["reizrēķins 2–5","reizrēķins 2–9","līdz 12 × 12"],div:["reizrēķins 2–5","reizrēķins 2–9","līdz 12 × 12"]},
    ok:["Lieliski!","Jā!","Brīnišķīgi!","Super!","Oho!","Malacis!","Perfekti!"],no:["Mēģini vēlreiz!","Gandrīz!","Tev izdosies!","Paskaties uzmanīgi!"],
    result:"{score} / {len} ar pirmo mēģinājumu",champion:"Čempions! 🏆",great:"Lielisks darbs! 💪",good:"Labs sākums — trenējies, un izdosies vēl labāk! 🌱",streak:"Labākā sērija: {best} 🔥"},
  en:{title:"Number Wizard",footTip:"Tip: take your time — think first, then tap. ✨",sub:"Count, learn and collect stars!",home:"Home",opsTitle:"What shall we practise?",levelTitle:"Choose a challenge",lengthTitle:"How many questions?",start:"Let’s go! 🚀",again:"Play again 🔁",menu:"Menu",soundOn:"🔊 Sound",soundOff:"🔇 Sound off",theme:"🪄 Colours",language:"🌐 EN",homeLabel:"Home",
    ops:{add:"Addition",sub:"Subtraction",mul:"Multiplication",div:"Division"},levels:["⭐ Easy","⭐⭐ Medium","⭐⭐⭐ Hard"],
    hints:{add:["up to 20","two-digit + one-digit","two-digit + two-digit"],sub:["within 20","two-digit − one-digit","two-digit − two-digit"],mul:["tables 2–5","tables 2–9","up to 12 × 12"],div:["tables 2–5","tables 2–9","up to 12 × 12"]},
    ok:["Great!","Yes!","Awesome!","Super!","Wow!","Nice one!","Perfect!"],no:["Try again!","Almost!","You can do it!","Look closely!"],
    result:"{score} / {len} on the first try",champion:"Champion! 🏆",great:"Great job! 💪",good:"A great start — keep practising! 🌱",streak:"Best streak: {best} 🔥"}
};
const THEME_KEYS="bg g1 g2 panel panel2 c1 c2 field ink muted gold mint blue bad pend foot m1".split(" ");
const THEMES=[
["Nakts","#10172a #293a65 #422d62 #19243d #202e4b #1c2945 #17223a #101a30 #f4f6ff #aab6d3 #ffd166 #75e6c1 #8ab4ff #ff6b7d #71809f #8290ad #27385c"],
["Mežs","#0f1d1a #1f4a40 #2b3b2a #162b26 #1d3731 #19302a #14261f #0d1a17 #eef7f1 #a5c2b6 #e8c872 #8fe3b8 #8bc7d9 #ff7a7a #6b8a7e #7d9a8d #234238"],
["Vakars","#1c1424 #4a2a45 #5a3524 #2a1d35 #33243f #2d2038 #241a2d #1a1222 #f7efee #c4b0bf #f2c078 #8fd9bf #a9b4f0 #ff7d8d #85738a #9a8799 #42304f"],
["Jūra","#0c1a24 #134057 #1d3550 #132a38 #1a3646 #162f3f #11242f #0a1620 #eef6fa #9fbccb #f0cd7a #6fdcc9 #7fb8f0 #ff7b86 #668396 #7a95a5 #1f4258"],
["Kakao","#1b1612 #43301f #3a2a3a #2a2119 #352a20 #2d241b #231c15 #17120e #f6efe6 #bfae9b #f0c27a #9ad9b0 #9db8e0 #ff8070 #84735f #978671 #433325"],
["Ogle","#141414 #3a2a1a #2a2a3a #211e1c #2c2825 #26221f #1d1a18 #131110 #f5f0ea #bcb2a6 #ffb86b #a6e3a1 #89b4fa #ff7f8e #7d746b #918779 #3a322b"],
["Ziedi","#1e1220 #5a2a4e #3a2a5a #2c1b2f #382340 #301f35 #261829 #1a0f1c #fbeff5 #cdb0c3 #ff9ec0 #b6f0d0 #c3a8ff #ff7a85 #8a6f86 #a28699 #4a2d52"],
["Debesis","#16233a #2f5f8f #3d4f8f #1f3252 #29406a #243a5e #1b2d4a #13203a #f2f7ff #aec4e0 #ffd479 #7ee8d0 #8fc5ff #ff7b8a #6f87a8 #839bb9 #2d4a78"],
["Laima","#17200f #3c5a1f #2a4a3a #212f17 #2b3d1f #263620 #1e2b16 #131b0c #f3f8e9 #b6c79f #f2d46b #b4f07a #8fd6e8 #ff8070 #77885f #8a9b72 #34492a"],
["Ceriņi","#1a1330 #4b2f8a #2f3f8a #271d47 #32265a #2c2150 #231a40 #150f28 #f4f0ff #bcb0e0 #ffd07a #7fe6cf #a5b4ff #ff7f9a #7a6fa6 #9188bb #3d2f70"],
["Saulriets","#231419 #6a2f2a #4a2a5a #33202a #402a35 #3a2430 #2c1b24 #1d1015 #fff0ea #d4b3aa #ffc27a #9ce6b8 #f7a8b8 #ff6f7d #8f6f72 #a58487 #4f2f3a"],
["Tirkīzs","#0d1f21 #14585a #1f3f5a #15302f #1c3c3b #183634 #122b2a #0a1819 #eefafa #9fc8c6 #ffd27a #7df0d8 #7fd0f0 #ff7f86 #62908e #76a3a1 #1f4a48"]
].map(([name,values])=>[name,values.split(" ")]);
const stored=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const persist=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
let lang=stored("bb_lang","lv");if(typeof lang!=="string"||!Object.hasOwn(COPY,lang))lang="lv";
let theme=stored("bb_theme",0);if(!Number.isInteger(theme)||!THEMES[theme])theme=0;
let muted=stored("bb_mute",false);
let sel=new Set(["add"]),lvl=0,len=10,sound=!muted;
let G={},nextTimer=0;
const cancelNext=()=>{clearTimeout(nextTimer);nextTimer=0};
const toMenu=()=>{cancelNext();show("menu")};
const t=key=>COPY[lang][key];

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function updateLabels(){
  const words=COPY[lang];
  document.documentElement.lang=lang;
  document.title=words.title;
  $("#gameTitle").textContent=words.title;
  $("#gameSub").textContent=words.sub;
  $("#footTip").textContent=words.footTip;
  $("#homeLink").textContent="✨ "+words.home;
  $("#homeLink").setAttribute("aria-label",words.homeLabel);
  $("#opsTitle").textContent=words.opsTitle;
  $("#levelTitle").textContent=words.levelTitle;
  $("#lengthTitle").textContent=words.lengthTitle;
  $("#start").textContent=words.start;
  $("#again").textContent=words.again;
  $("#menuBtn").textContent=words.menu;
  $("#themeBtn").textContent=words.theme;
  $("#langBtn").textContent=words.language;
  $("#langBtn").setAttribute("aria-label",lang==="lv"?"Switch language":"Pārslēgt valodu");
  $("#snd").textContent=sound?words.soundOn:words.soundOff;
  $("#back").setAttribute("aria-label",words.home);
  $("#snd").setAttribute("aria-pressed",String(!sound));
}
function applyTheme(){
  THEME_KEYS.forEach((key,i)=>document.documentElement.style.setProperty("--"+key,THEMES[theme][1][i]));
  persist("bb_theme",theme);
}
$("#langBtn").onclick=()=>{
  lang=lang==="lv"?"en":"lv";
  persist("bb_lang",lang);
  updateLabels();
  drawMenu();
  $("#say").textContent="";
};
$("#themeBtn").onclick=()=>{theme=(theme+1)%THEMES.length;applyTheme()};

/* ---------- menu ---------- */
function drawMenu(){
  $("#ops").innerHTML=Object.keys(OPS).map(k=>`<button class="chip ${sel.has(k)?"on":""}" data-op="${k}">${OPS[k]} ${t("ops")[k]}</button>`).join("");
  $("#lv").innerHTML=t("levels").map((label,i)=>`<button class="chip ${lvl===i?"on":""}" data-lv="${i}">${label}</button>`).join("");
  $("#len").innerHTML=[5,10,20].map(n=>`<button class="chip ${len===n?"on":""}" data-len="${n}">${n}</button>`).join("");
  $("#hint").textContent=[...sel].map(k=>`${OPS[k]} ${t("hints")[k][lvl]}`).join(" • ");
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.op){const k=b.dataset.op;if(sel.has(k)){if(sel.size>1)sel.delete(k)}else sel.add(k);drawMenu()}
  else if(b.dataset.lv){lvl=+b.dataset.lv;drawMenu()}
  else if(b.dataset.len){len=+b.dataset.len;drawMenu()}
});

/* ---------- questions ---------- */
function gen(){
  const op=pick([...sel]);let a,b,t,ans;
  if(op==="add"){
    if(lvl===0){a=r(2,10);b=r(2,10)}
    else if(lvl===1){a=r(11,99);b=r(2,9)}
    else{a=r(11,88);b=r(11,99-a)}
    t=`${a} + ${b}`;ans=a+b;
  }else if(op==="sub"){
    if(lvl===0){a=r(5,20);b=r(1,a-1)}
    else if(lvl===1){a=r(11,99);b=r(2,9)}
    else{a=r(21,99);b=r(11,a-1)}
    t=`${a} − ${b}`;ans=a-b;
  }else{
    const [lo,hi]=lvl===0?[2,5]:lvl===1?[2,9]:[6,12];
    a=r(lo,hi);b=r(lo,hi);
    if(op==="mul"){t=`${a} × ${b}`;ans=a*b}
    else{t=`${a*b} ÷ ${a}`;ans=b}
  }
  return {t,ans};
}
function options(c){
  const rev=+[...String(c)].reverse().join("");
  let cand=shuffle([c+1,c-1,c+2,c-2,c+10,c-10,rev,c+r(3,9),c-r(3,9)]);
  const s=[];
  for(const v of cand){if(v>=0&&v!==c&&!s.includes(v))s.push(v);if(s.length===3)break}
  let k=3;while(s.length<3){const v=c+k++;if(!s.includes(v))s.push(v)}
  return shuffle([c,...s]);
}

/* ---------- game ---------- */
function start(){
  audio();cancelNext();
  G={i:0,score:0,streak:0,best:0,miss:false,lock:false,last:""};
  show("game");next();
}
function next(){
  if(G.i>=len)return finish();
  let q;do{q=gen()}while(q.t===G.last&&len>1);
  G.q=q;G.last=q.t;G.miss=false;G.lock=false;
  $("#qt").textContent=q.t+" = ?";
  $("#qt").style.animation="none";void $("#qt").offsetWidth;$("#qt").style.animation="";
  $("#grid").innerHTML=options(q.ans).map(v=>`<button class="ans" data-v="${v}">${v}</button>`).join("");
  $("#cnt").textContent=`${G.i+1}/${len}`;
  $("#pb").style.width=(G.i/len*100)+"%";
  $("#st").textContent="🔥"+G.streak;
  $("#fox").textContent="🦊";
}
$("#grid").addEventListener("click",e=>{
  const b=e.target.closest(".ans");if(!b||G.lock)return;
  const ok=+b.dataset.v===G.q.ans;
  if(ok){
    G.lock=true;b.classList.add("ok");
    if(!G.miss){G.score++;G.streak++;G.best=Math.max(G.best,G.streak)}
    const rc=b.getBoundingClientRect();
    burst(rc.left+rc.width/2,rc.top+rc.height/2,G.streak>=3?90:50);
    good();    $("#say").textContent=pick(t("ok"))+(G.streak>=3?` ${G.streak} ${lang==="lv"?"pareizi pēc kārtas!":"in a row!"}`:"");
    $("#fox").textContent=pick(["🎉","🤩","🦊","🚀","⭐"]);
    $("#fox").classList.remove("jump");void $("#fox").offsetWidth;$("#fox").classList.add("jump");
    $("#st").textContent="🔥"+G.streak;G.i++;
    $("#pb").style.width=(G.i/len*100)+"%";
    nextTimer=setTimeout(()=>{nextTimer=0;next()},650);
  }else{
    G.miss=true;G.streak=0;b.classList.add("no");bad();
    $("#say").textContent=pick(t("no"));$("#st").textContent="🔥0";$("#fox").textContent="🤔";
  }
});
document.addEventListener("keydown",e=>{
  if(e.repeat)return;
  if($("#game").classList.contains("on")&&e.key>="1"&&e.key<="4"){const b=$("#grid").children[+e.key-1];if(b&&!b.classList.contains("no"))b.click();return}
  // A focused button already reacts to Enter by itself; don't also start a game.
  if(e.key==="Enter"&&!e.target.closest("button,a")&&($("#end").classList.contains("on")||$("#menu").classList.contains("on")))start();
});
function finish(){
  show("end");
  const p=G.score/len,n=p>=.9?3:p>=.6?2:1;
  $("#stars").innerHTML=[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s;opacity:${i<n?1:.25}">⭐</span>`).join("");
  $("#res").textContent=t("result").replace("{score}",G.score).replace("{len}",len);
  $("#msg").textContent=(n===3?t("champion"):n===2?t("great"):t("good"))+(G.best>1?`  ${t("streak").replace("{best}",G.best)}`:"");
  $("#say").textContent="";
  [.2,.5,.8].forEach(x=>setTimeout(()=>burst(innerWidth*x,innerHeight*.35,110),x*600));
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle"),i*120));
}
$("#start").onclick=start;
$("#again").onclick=start;
$("#menuBtn").onclick=toMenu;
$("#back").onclick=toMenu;
$("#snd").onclick=()=>{sound=!sound;muted=!sound;persist("bb_mute",muted);updateLabels();if(sound)audio()};

/* ---------- sound ---------- */
let ac;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.state==="suspended"&&ac.resume()}catch(e){}}
function tone(f,d,type="sine",v=.15){
  if(!sound||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.start();o.stop(ac.currentTime+d);
}
function good(){const base=523*Math.pow(1.06,Math.min(G.streak,8));[1,1.25,1.5].forEach((m,i)=>setTimeout(()=>tone(base*m,.18,"triangle"),i*70))}
function bad(){tone(220,.25,"sawtooth",.08)}

/* ---------- confetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let P=[],on=false;
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
fit();addEventListener("resize",fit);
function burst(x,y,n){
  for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,s:5+Math.random()*7,c:`hsl(${r(0,360)} 90% 60%)`,a:Math.random()*6,l:70+r(0,30),round:Math.random()<.4});
  if(!on){on=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.vx*=.98;p.a+=.2;p.l--;
    cx.globalAlpha=Math.min(1,p.l/25);cx.fillStyle=p.c;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    if(p.round){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);
    cx.restore();
  }
  P=P.filter(p=>p.l>0);
  if(P.length)requestAnimationFrame(loop);else{on=false;cx.clearRect(0,0,cv.width,cv.height)}
}
let lastSpark=0;
addEventListener("pointermove",e=>{
  if(e.pointerType==="touch"||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const now=performance.now();if(now-lastSpark<48)return;lastSpark=now;
  const spark=document.createElement("span");spark.className="cursor-spark";spark.textContent=String(Math.floor(Math.random()*10));   // cursor trail: glowing digits
  spark.style.left=e.clientX+"px";spark.style.top=e.clientY+"px";
  spark.style.setProperty("--dx",(Math.random()*30-15)+"px");spark.style.setProperty("--size",(12+Math.random()*9)+"px");
  document.body.appendChild(spark);setTimeout(()=>spark.remove(),850);
},{passive:true});
updateLabels();
applyTheme();
drawMenu();
</script>
</body></html>
